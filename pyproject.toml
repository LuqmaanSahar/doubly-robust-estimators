[build-system]
requires = ["setuptools", "wheel", "setuptools_scm", "build"]  # Build requirements
build-backend = "setuptools.build_meta"

[project]
name = "overlapsim"
dynamic = ["version"]
description = "Coursework for D300 of the 2025/26 MPhil in Economics and Data Science."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  {name = "anonymous", email = "anonymous@anon.com"}
]
keywords = ["Doubly Robust Estimation", "Overlap", "Simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Researchers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries"
]

# Runtime dependencies
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "econml"
]


# dynamic versioning in '0.0.0.post' format
[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
write_to = "src/overlapsim/version.py"


[tool.setuptools]
package-dir = {"" = "src"}

# where to look for the package
[tool.setuptools.packages.find]
where = ["src"]

# where pytest looks for the package
[tool.pytest.ini_options]
pythonpath = ["src"]